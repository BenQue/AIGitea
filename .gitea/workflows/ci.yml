# 受保护 main 的必需检查是精确字符串 `CI / verify (pull_request)`，由 workflow 名（CI）
# + job key（verify）+ 事件三者构成——改任何一个，或把某个步骤拆成新的 job，
# 都会让必需检查失配，此后所有 PR 永久 pending。见平台文档 02 §2。
# Issue #223 只在这个 job 里多加了两步，三者一个都没动。
name: CI

# #397：push 到 main 也跑同一个 job，合并后主干是否仍绿有了自己的记录。push 运行产生的
# context 是 `CI / verify (push)`，不是必需检查；必需检查字符串不变。合并预览步骤本来就只在
# pull_request 上跑。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # #370：不再用 actions/checkout——它每次都要从 GitHub 取 action 本身。这里只和
      # 本 job 已经在用的 Gitea（$GITHUB_SERVER_URL）说话，取全量历史（三方合并要找
      # base 与 head 的共同祖先，浅克隆找不到），检出 PR head。host 模式的工作区跨
      # run 复用，所以先清干净再检出。job token 像 actions/checkout 默认那样写进本地
      # git 配置供合并预览取 base，最后一步无论成败都删掉。
      - name: Check out
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          header_key="http.${GITHUB_SERVER_URL}/.extraheader"
          git init -q .
          git config --local --unset-all "$header_key" || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "$header_key" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          for attempt in 1 2 3; do
            git fetch --no-tags --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pull/*/head' && break
            (( attempt < 3 )) || { echo '[checkout] CHECKOUT_FETCH_FAILED' >&2; exit 1; }
            sleep 5
          done
          # 上一次 run 可能停在合并预览的半途（冲突、MERGE_HEAD）；先回到干净状态。
          git merge --abort 2>/dev/null || true
          git reset -q --hard 2>/dev/null || true
          git checkout -q --force --detach "$CHECKOUT_SHA"
          git clean -ffdxq
          echo "[checkout] HEAD = $(git rev-parse HEAD)"

      # Issue #223：本仓自己也暴露在这个盲区里——smoke 里有 operation_count 这类
      # 手工维护的常数，两个并行 PR 各加一条 typed 操作、各把 N 改成 N+1，
      # 就会各自绿、合并后主干红。这一步把工作区推进到「head 与 main 当前尖端的
      # 合并结果」，拿不到就明确失败，绝不回退到 head。
      #
      # 跑的是 templates/project/ci/ 里那份参考实现本身，不另存一份副本：
      # 本仓的每一次 PR 都在验证发给各项目的那个文件。
      # 不要给这一步加 continue-on-error：一个可以静默失败的预览不是闸门。
      - name: Check out merge preview
        if: github.event_name == 'pull_request'
        env:
          MERGE_PREVIEW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          bash templates/project/ci/merge-preview.sh 2>&1 \
            | tee "$RUNNER_TEMP/merge-preview.log"

      - name: Platform smoke suite
        run: bash codex/tests/smoke.sh

      # #316: remain in the existing required verify job. Fixed native toolchain,
      # model/SQLite/race and actual binary canaries; no helper install or live PAT.
      # #370: Go archive and modules persist under the runner user's own HOME and
      # are re-verified against the pins on every run.
      - name: Pinned Linux PAT helper verification
        run: |
          AISOFT_CI_DOWNLOAD_CACHE="$HOME/.cache/aisoft-ci" \
          bash codex/tests/test-gitea-pat-helper-linux.sh \
            --output "$RUNNER_TEMP/issue-316-helper/gitea-pat-helper"

      # 把合并预览的输出重印在 job 末尾：日志读取可能截头不截尾，而「这次跑的
      # 到底是哪棵树」正是本 job 最该留下的证据。always() 让失败原因也留得下来。
      - name: Merge preview evidence
        if: always() && github.event_name == 'pull_request'
        run: cat "$RUNNER_TEMP/merge-preview.log" || echo '[ci] 没有合并预览日志'

      - name: Remove checkout credential
        if: always()
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
