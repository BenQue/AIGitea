# CI workflow 参考（AISoft 平台 Issue #223）。逐项目复制到 .gitea/workflows/ci.yml 后按需裁剪；
# 这不是一份逐字节 vendored 的合同副本，各项目的构建与测试步骤本来就不同。
#
# ⚠️ 必需检查的 context 是一个精确字符串，由 workflow 名 + job key + 事件三者构成
# （例如 `CI / verify (pull_request)`，见平台文档 02 §2）。改这三者中任何一个，
# 或者把某个步骤拆成新的 job，都会让受保护 main 的必需检查失配，此后所有 PR 永久 pending。
# 本参考里所有闸门都留在同一个 job 内，就是这个原因。
#
# 本参考解决的是「pull_request 跑的是 PR head 而非合并结果」这个结构性盲区：
# 两个并行 PR 各自诚实地绿、合并后主干红。合并预览由 merge-preview.sh 在运行时现场做，
# 拿不到就明确失败，绝不静默回退到 head——一个跑在 head 上的绿正是事故里那个假绿。
#
# 只做这一半是不够的：这次预览是在本次运行那一刻算的，而合并发生在之后。
# 中间别人合并进 base 之后没有任何东西让它重跑。另一半是分支保护的
# block_on_outdated_branch，由平台侧在 Gitea 界面打开，不在本文件内。
#
# 第二个结构性盲区（AISoft 平台 Issue #201）：npm ci 命中 runner 的 _cacache 时
# 根本不发起网络请求，所以 registry 死掉之后，只用既有依赖的 PR 仍然 20 秒全绿。
# 2026-08 那次 Verdaccio 停机因此静默潜伏约 28 小时，只在某个 PR 恰好引入新包时才炸。
# registry-preflight.sh 每次都真的取一次包，把那个藏身处拆掉。

name: CI

on:
  pull_request:
    branches: [main]
  # push 那一路可选。它本来就跑在真实的目标分支上，不需要合并预览。
  push:
    branches: [main]

permissions:
  contents: read

# registry 是 CI 的硬依赖，显式写在这里而不是散在各步骤里。
# 换成本平台实际的 registry 地址；不要改成 registry.npmjs.org。
env:
  NPM_CONFIG_REGISTRY: http://gitea-ci.orb.local:4873/

jobs:
  # job key 是必需检查 context 的一部分，改名前先回读分支保护。
  verify:
    runs-on: ubuntu-latest
    steps:
      # 三方合并要找 base 与 head 的共同祖先，浅克隆找不到，所以 pull_request 那一路
      # 取全历史；push 那一路保持默认的 depth 1。
      #
      # 条件写成 `== 'push'` 而不是 `== 'pull_request'` 是刻意的：表达式里
      # `A && 0 || 1` 永远得 1——`0` 本身是 falsy，`&&` 交出 `0` 之后 `||` 又把它丢掉。
      # 把 truthy 的那个值放在 `&&` 右边就绕开了这个陷阱。
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 1 || 0 }}

      # 本参考的本体。必须留在这个 job 内——它只是 job 里多出来的一步，
      # workflow 名、job key、事件三者一个都没动，分支保护不需要任何改动。
      #
      # `if` 守卫就是「push 那一路行为未变」的机制本身：push 事件根本不进这一步。
      # 脚本失败即整个 job 红，不回退到 head。
      # 不要给这一步加 continue-on-error：一个可以静默失败的预览不是闸门。
      - name: Check out merge preview
        if: github.event_name == 'pull_request'
        env:
          MERGE_PREVIEW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          bash scripts/ci/merge-preview.sh 2>&1 | tee "$RUNNER_TEMP/merge-preview.log"

      # registry 存活断言。必须排在**任何依赖安装之前**，也留在这个 job 内。
      #
      # 不加 `if`：正因为它在每一次运行上都跑，registry 死掉的那一刻就有运行会红，
      # 而不必等某个 PR 恰好引入缓存外的新包。这一步本身只有几百毫秒。
      #
      # 不要给这一步加 continue-on-error，也不要在它失败后把 registry 改成
      # registry.npmjs.org 继续跑：那会同时抹掉离线安装能力和这条故障的可见性。
      # 应用仓**不得**为了让 CI 变绿而绕过 NPM_CONFIG_REGISTRY，见平台文档 01 §5。
      #
      # 失败时日志里有固定标记 AISOFT_REGISTRY_PREFLIGHT_FAIL 与 stage=<阶段>，
      # 按标记检索即可；stage=connect 表示那个端口上没有进程在监听，
      # 这一类**不要**往 uplink 或网络策略方向排查。
      - name: Registry preflight
        env:
          NPM_CONFIG_REGISTRY: ${{ env.NPM_CONFIG_REGISTRY }}
        run: bash scripts/ci/registry-preflight.sh

      # 从这里往下换成本项目自己的构建、闸门与测试步骤。全部留在同一个 job 内。
      # 依赖安装排在 registry 存活断言之后。
      - name: Project checks
        run: echo '换成本项目自己的测试命令'

      # 把合并预览的输出原样重印在 job 末尾。这不是冗余：日志读取可能截头不截尾，
      # 而「这次跑的到底是哪棵树」正是本 job 最该留下的证据。
      # always() 让合并预览失败时那条失败原因也留得下来。
      - name: Merge preview evidence
        if: always() && github.event_name == 'pull_request'
        run: cat "$RUNNER_TEMP/merge-preview.log" || echo '[ci] 没有合并预览日志'
