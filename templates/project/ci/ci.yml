# CI workflow 参考（AISoft 平台 Issue #223）。逐项目复制到 .gitea/workflows/ci.yml 后按需裁剪；
# 这不是一份逐字节 vendored 的合同副本，各项目的构建与测试步骤本来就不同。
#
# ⚠️ 必需检查的 context 是一个精确字符串，由 workflow 名 + job key + 事件三者构成
# （例如 `CI / verify (pull_request)`，以本仓声明的 status_check_contexts 为准：`.aisoft/project.json`，
# 或登记了站点加固访问时的平台 governance manifest）。改这三者中任何一个，或者把某个步骤拆成新的 job，
# 都会让受保护 main 的必需检查失配，此后所有 PR 永久 pending。
# 本参考里所有闸门都留在同一个 job 内，就是这个原因。
#
# 本参考解决的是「pull_request 跑的是 PR head 而非合并结果」这个结构性盲区：
# 两个并行 PR 各自诚实地绿、合并后主干红。合并预览由 merge-preview.sh 在运行时现场做，
# 拿不到就明确失败，绝不静默回退到 head——一个跑在 head 上的绿正是事故里那个假绿。
#
# 只做这一半是不够的：这次预览是在本次运行那一刻算的，而合并发生在之后。
# 中间别人合并进 base 之后没有任何东西让它重跑。另一半是分支保护的
# block_on_outdated_branch，由平台侧在 Gitea 界面打开，不在本文件内。
#
# 第二个结构性盲区（AISoft 平台 Issue #201）：npm ci 命中 runner 的 _cacache 时
# 根本不发起网络请求，所以 registry 死掉之后，只用既有依赖的 PR 仍然 20 秒全绿。
# 2026-08 那次 Verdaccio 停机因此静默潜伏约 28 小时，只在某个 PR 恰好引入新包时才炸。
# registry-preflight.sh 每次都真的取一次包，把那个藏身处拆掉。

name: CI

on:
  pull_request:
    branches: [main]
  # push 那一路可选。它本来就跑在真实的目标分支上，不需要合并预览。
  push:
    branches: [main]

permissions:
  contents: read

# registry 是 CI 的硬依赖，显式写在这里而不是散在各步骤里。
# 把占位换成平台 broker manifest（codex/config/host-access-broker.json）里
# site.npm_registry 的值；不要改成 registry.npmjs.org。占位不换时
# registry-preflight 在安装依赖之前就失败。
env:
  NPM_CONFIG_REGISTRY: REPLACE_WITH_SITE_NPM_REGISTRY

jobs:
  # job key 是必需检查 context 的一部分，改名前先回读分支保护。
  verify:
    runs-on: ubuntu-latest
    steps:
      # #402（沿用平台仓 #370 的做法）：不用 actions/checkout——它每次都要从 GitHub 取
      # action 本身。这里只和本 job 已经在用的 Gitea（$GITHUB_SERVER_URL）说话，不写任何
      # 站点地址。取全量历史（三方合并要找 base 与 head 的共同祖先，浅克隆找不到），
      # 检出 exact head。host 模式的工作区跨 run 复用，所以先清干净再检出。job token
      # 像 actions/checkout 默认那样写进本地 git 配置，供合并预览取 base；最后一步无论
      # 成败都删掉。
      - name: Check out
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          header_key="http.${GITHUB_SERVER_URL}/.extraheader"
          git init -q .
          git config --local --unset-all "$header_key" || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "$header_key" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          # 复用的工作区可能是旧 actions/checkout 留下的浅克隆（push 那一路曾是 depth 1）；普通
          # fetch 补不全历史，合并预览会找不到共同祖先，所以浅仓一律 --unshallow。每轮重试前重新
          # 判断：上一轮可能已补全历史却因别的原因失败，对完整仓再传 --unshallow 会直接报错。
          for attempt in 1 2 3; do
            unshallow=()
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then unshallow=(--unshallow); fi
            git fetch --no-tags --prune --force ${unshallow[@]+"${unshallow[@]}"} origin \
              '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pull/*/head' && break
            (( attempt < 3 )) || { echo '[checkout] CHECKOUT_FETCH_FAILED' >&2; exit 1; }
            sleep 5
          done
          # 上一次 run 可能停在合并预览的半途（冲突、MERGE_HEAD）；先回到干净状态。
          git merge --abort 2>/dev/null || true
          git reset -q --hard 2>/dev/null || true
          git checkout -q --force --detach "$CHECKOUT_SHA"
          git clean -ffdxq
          echo "[checkout] HEAD = $(git rev-parse HEAD)"

      # 本参考的本体。必须留在这个 job 内——它只是 job 里多出来的一步，
      # workflow 名、job key、事件三者一个都没动，分支保护不需要任何改动。
      #
      # `if` 守卫就是「push 那一路行为未变」的机制本身：push 事件根本不进这一步。
      # 脚本失败即整个 job 红，不回退到 head。
      # 不要给这一步加 continue-on-error：一个可以静默失败的预览不是闸门。
      - name: Check out merge preview
        if: github.event_name == 'pull_request'
        env:
          MERGE_PREVIEW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          bash scripts/ci/merge-preview.sh 2>&1 | tee "$RUNNER_TEMP/merge-preview.log"

      # registry 存活断言。必须排在**任何依赖安装之前**，也留在这个 job 内。
      #
      # 不加 `if`：正因为它在每一次运行上都跑，registry 死掉的那一刻就有运行会红，
      # 而不必等某个 PR 恰好引入缓存外的新包。这一步本身只有几百毫秒。
      #
      # 不要给这一步加 continue-on-error，也不要在它失败后把 registry 改成
      # registry.npmjs.org 继续跑：那会同时抹掉离线安装能力和这条故障的可见性。
      # 应用仓**不得**为了让 CI 变绿而绕过 NPM_CONFIG_REGISTRY，见平台文档 01 §5。
      #
      # 失败时日志里有固定标记 AISOFT_REGISTRY_PREFLIGHT_FAIL 与 stage=<阶段>，
      # 按标记检索即可；stage=connect 表示那个端口上没有进程在监听，
      # 这一类**不要**往 uplink 或网络策略方向排查。
      - name: Registry preflight
        env:
          NPM_CONFIG_REGISTRY: ${{ env.NPM_CONFIG_REGISTRY }}
        run: bash scripts/ci/registry-preflight.sh

      # 从这里往下换成本项目自己的构建、闸门与测试步骤。全部留在同一个 job 内。
      # 依赖安装排在 registry 存活断言之后。
      - name: Project checks
        run: echo '换成本项目自己的测试命令'

      # 把合并预览的输出原样重印在 job 末尾。这不是冗余：日志读取可能截头不截尾，
      # 而「这次跑的到底是哪棵树」正是本 job 最该留下的证据。
      # always() 让合并预览失败时那条失败原因也留得下来。
      - name: Merge preview evidence
        if: always() && github.event_name == 'pull_request'
        run: cat "$RUNNER_TEMP/merge-preview.log" || echo '[ci] 没有合并预览日志'

      # job token 只活在这一次 run 里；host 模式的工作区会被下一次 run 复用，所以删掉。
      - name: Remove checkout credential
        if: always()
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
